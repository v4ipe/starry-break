<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Starry Break - تنفيذ</title>
    <!-- This page carries its own styles and starts its own module, and it
         loads NOTHING else. That duplicates a little of style.css, and it is
         deliberate: every subresource is one more allocation and one more
         timing shift in the process that core.js is about to groom, and this
         exploit is decided by exactly that. The landing page may use the
         shared stylesheet; this one may not. -->
    <style>
      :root {
        --bg: #000000;
        --panel: rgba(12, 14, 18, 0.9);
        --sunk: rgba(8, 9, 12, 0.95);
        --line: rgba(255, 255, 255, 0.22);
        --fg: #e2e6ee;
        --bright: #ffffff;
        --dim: #88909f;
        --faint: #555b66;
        --ok: #ffffff;
        --bad: #d88a8a;
        --warn: #e0d090;
        --sans: "Tajawal", "Cairo", "Segoe UI", system-ui, -apple-system, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--bg);
        background-image: url('img/bg.jpg');
        background-position: center center;
        background-size: cover;
        background-attachment: fixed;
        color: var(--fg);
        font: 15px/1.45 var(--sans);
        position: relative;
      }
      /* Dark overlay for maximum readability and anime contrast */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.72);
        pointer-events: none;
        z-index: 0;
      }
      #brand, #ramBox, #spin, #msg, #wrap, .byline {
        position: relative;
        z-index: 1;
      }
      #brand {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      #brand b {
        color: var(--bright);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
      }
      #brand span {
        font-size: 13px;
        color: var(--dim);
        margin-right: 8px;
      }
      /* The live heap readout sits in the flow under the bar */
      #ramBox {
        overflow: hidden;
        padding: 6px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: var(--bright);
        font: 12px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
        direction: ltr;
        text-align: left;
      }
      /* Minimalist anime glowing spinner */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: var(--bright);
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        animation: spin 0.85s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--bright);
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.8);
      }
      #state,
      #out {
        display: none;
      }
      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
        color: #ff9999;
      }
      body.done #msg {
        display: block;
        color: var(--bright);
        font-weight: 700;
        letter-spacing: 2px;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.95);
      }
      /* ?log=1 -- the full step log */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 16px 20px 36px;
      }
      body.log #state {
        display: block;
        margin: 0 0 10px;
        font-size: 20px;
        font-weight: 700;
        color: var(--bright);
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        text-align: right;
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--sunk);
        color: var(--fg);
        font: 12px/1.5 var(--mono);
        white-space: pre-wrap;
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 255, 255, 0.05);
        direction: ltr;
        text-align: left;
      }
      /* The retry notice */
      .notice {
        margin: 1em 0;
        padding: 0.8em 1.2em;
        border: 1.5px solid #ff7777;
        background: rgba(45, 15, 15, 0.9);
        color: #ffcccc;
        font: 700 18px/1.4 var(--sans);
        border-radius: 4px;
        text-align: center;
        box-shadow: 0 0 20px rgba(255, 80, 80, 0.4);
      }
      .byline {
        position: fixed;
        bottom: 10px;
        left: 14px;
        margin: 0;
        color: var(--faint);
        font: 12px/1 var(--sans);
        letter-spacing: 0.06em;
        direction: rtl;
      }
      .ok {
        color: var(--bright);
        font-weight: bold;
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      code {
        color: #ffffff;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.4);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.25);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <!-- jb.js owns the body class: .log while the step log is shown, .done or
         .fail once the chain has settled. The ids below are its contract --
         #ramBox, #msg, #state and #out are read by name. -->
    <div id="brand">
      <b>Starry Break</b>
      <span>&middot; بواسطة نصرو بن عياد</span>
    </div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">أعد تشغيل الجهاز (Restart your console)</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">Starry Break &middot; بواسطة نصرو بن عياد</p>
    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
